<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>Session report</title>
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <!-- Full-window session report: the transcript and the AI summary of a call,
       laid out as a document rather than as an overlay pane, plus a grounded
       Q&A dock so the user can interrogate the meeting instead of re-reading it. -->
  <div class="page">
    <header class="topbar">
      <div class="tb-brand">
        <!-- Back, not a ✕: this window sits in FRONT of the app, so leaving it
             returns you to Confero. It also lives on the left, where a back
             action is looked for — and where it can't be mistaken for the OS
             close button in the window frame. -->
        <button id="rBack" class="btn tb-back" title="Back to Confero (Esc)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3.2M7 3.6L2.6 8 7 12.4"/></svg>
          <span>Back</span>
        </button>
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6.5" fill="url(#cfGrad)"/>
            <path d="M16.8 8.1a5.4 5.4 0 1 0 0 7.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="16.9" cy="12" r="1.7" fill="#fff"/>
            <defs>
              <linearGradient id="cfGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#5da9e9"/>
                <stop offset="1" stop-color="#3f8ecb"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <div class="tb-titles">
          <h1 id="rTitle">Session report</h1>
          <p class="tb-meta" id="rMeta">Wrapping up the session…</p>
        </div>
      </div>

      <div class="tb-actions">
        <button id="rRegen" class="btn" title="Write the summary again">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.4 1.9v3.2h-3.2"/></svg>
          <span>Regenerate</span>
        </button>
        <button id="rCopy" class="btn primary" title="Copy the summary">
          <svg class="ic-copy" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.6" y="5.6" width="8.4" height="8.4" rx="1.8"/><path d="M11 5.6V3.8A1.8 1.8 0 0 0 9.2 2H3.8A1.8 1.8 0 0 0 2 3.8v5.4A1.8 1.8 0 0 0 3.8 11h1.8"/></svg>
          <svg class="ic-check" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6l3.2 3.2L13 5"/></svg>
          <span id="rCopyLabel">Copy summary</span>
        </button>
        <button id="rPdf" class="btn" title="Save the whole report as a PDF">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9v7.6M5 6.6L8 9.6l3-3"/><path d="M2.4 11v1.8a1.3 1.3 0 0 0 1.3 1.3h8.6a1.3 1.3 0 0 0 1.3-1.3V11"/></svg>
          <span id="rPdfLabel">Download PDF</span>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <div class="tabs-left">
        <button class="tab active" data-tab="summary" id="tabSummary">Summary</button>
        <button class="tab" data-tab="transcript" id="tabTranscript">Transcript</button>
      </div>
      <div class="tabs-right">
        <label class="find hidden" id="rFindWrap">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14" stroke-linecap="round"/></svg>
          <input id="rFind" type="text" placeholder="Find in transcript" spellcheck="false" />
          <span class="find-count" id="rFindCount"></span>
        </label>
        <span class="saved-note" id="rSaved"></span>
      </div>
    </nav>

    <main class="scroll" id="rScroll">
      <article class="doc" id="rDoc"></article>
      <!-- Print/PDF only. printToPDF renders this live page under print media, so
           the exported file is the WHOLE report — title block, summary and
           transcript — not a snapshot of whichever tab happens to be open. -->
      <article class="print-doc" id="rPrint" aria-hidden="true"></article>
    </main>

    <!-- Ask dock: grounded Q&A over this session's transcript + summary. -->
    <section class="ask" id="rAsk">
      <div class="ask-head hidden" id="rAskHead">
        <span class="ask-title">Ask about this meeting</span>
        <div class="ask-head-actions">
          <button type="button" id="rClear" class="link-btn">Clear</button>
          <button type="button" id="rCollapse" class="link-btn icon-only" title="Hide the thread" aria-label="Hide the thread">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.2L8 10l4-3.8"/></svg>
          </button>
        </div>
      </div>
      <div class="ask-thread hidden" id="rThread"></div>
      <div class="ask-inner">
        <div class="chips" id="rChips"></div>
        <form class="composer" id="rForm">
          <span class="composer-glyph" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.6l1.3 3.5 3.5 1.3-3.5 1.3L8 11.2 6.7 7.7 3.2 6.4l3.5-1.3L8 1.6z"/><path d="M12.6 10.4l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6.6-1.6z"/></svg>
          </span>
          <textarea id="rInput" rows="1" placeholder="Ask anything about this meeting…" spellcheck="false"></textarea>
          <button type="submit" id="rSend" class="send" title="Ask (Enter)" aria-label="Ask">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 8h10.4M8.4 3.6L12.9 8l-4.5 4.4"/></svg>
          </button>
        </form>
        <p class="ask-foot" id="rAskFoot">Answers come only from this session's transcript and summary.</p>
      </div>
      <!-- Corner disclaimer: the summary and every answer here are model output. -->
      <p class="ask-legal">AI-generated content may be incorrect.</p>
    </section>

    <!-- Where the PDF went. A saved file the user can't find reads as a failure. -->
    <div class="toast" id="rToast" role="status"></div>
  </div>

  <script src="summaryFormat.js"></script>
  <script src="report.js"></script>
</body>
</html>
